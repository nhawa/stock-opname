services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_opname_test
      POSTGRES_USER: stock_opname_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in your shell before starting the test database.}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_opname_test -d stock_opname_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

volumes:
  postgres-test-data:
