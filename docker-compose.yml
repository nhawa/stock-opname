services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_opname
      POSTGRES_USER: stock_opname
      POSTGRES_PASSWORD: stock_opname
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_opname -d stock_opname"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
